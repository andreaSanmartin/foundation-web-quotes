# Configuracion de la aplicacion.
# Los valores sensibles se leen de variables de entorno (ver .env.example en la raiz del backend).
# Formato: ${VARIABLE:valor_por_defecto}

# Carga opcional de un archivo .env local (no se versiona)
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:3000}

#Archivos
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:20MB}

#MongoDB
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/nombre_fundacion}

#CORS (origenes separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

#Mail Sender
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

#Usuario SuperAdministrador inicial (solo se crea si la base no tiene usuarios)
app.admin.cedula=${ADMIN_CEDULA:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.nombre=${ADMIN_NOMBRE:Administrador}
